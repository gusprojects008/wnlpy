[project]
name = "wnlpy"
version = "1.0.0"
description = "A Python module that provides a high-level interface for configuring and controlling WiFi network devices through the nl80211 netlink subsystem of the Linux kernel"
authors = [{name = "Gustavo Araújo"}]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["wnlpy"]
